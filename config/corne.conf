# Cấu hình khử nhiễu phím
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3

# Cấu hình enconder
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Cấu hình công suất phát BLE
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Khắc phục lỗi báo cáo pin trên Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Màn hình OLED: tắt để tiết kiệm pin (màn vẫn lắp được, bật lại bằng =y)
CONFIG_ZMK_DISPLAY=n
# Vẫn bật driver màn (không bật ZMK display) để src/oled_off.c gửi lệnh tắt màn lúc khởi động
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_I2C=y

# Cấu hình quản lý năng lượng
CONFIG_ZMK_IDLE_TIMEOUT=150000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Cấu hình đánh thức
# Nguồn ngoài (chân VCC cấp cho OLED): cắt hẳn, xem corne.overlay
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_USB=y

# Cấu hình ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Đèn nền RGB: tắt (mạch không gắn LED, tránh tốn pin)
CONFIG_ZMK_RGB_UNDERGLOW=n

# Cải thiện ổn định kết nối BLE
CONFIG_BT_BUF_ACL_RX_SIZE=512
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Tối ưu hóa log
CONFIG_ZMK_USB_LOGGING=n

# Không xóa bond khi khởi động
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
